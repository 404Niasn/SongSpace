# Paste inside the site's existing server {} block, replacing location / if present.
# Set its root to /www/wwwroot/songspace/songspace-web/dist first.
# Keep Baota's SSL, certificate renewal and log configuration.
client_max_body_size 512k;

location ^~ /api/ {
    # No trailing slash: preserve /api/v1/... for FastAPI.
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
}

location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location ^~ /catalog/ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
}

location ^~ /audio/ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
}

location = /index.html {
    add_header Cache-Control "no-cache";
}

location / {
    try_files $uri $uri/ /index.html;
}
