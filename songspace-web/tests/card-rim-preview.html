<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>歌境 · 卡边材质校验</title>
<style>body{margin:0}.rim-preview{display:flex;justify-content:center;align-items:center;gap:64px;min-height:100vh;padding:60px 30px;box-sizing:border-box;background:radial-gradient(ellipse,#e8edf0,#f8fafb 70%)}.rim-sample{display:grid;justify-items:center;gap:28px}.rim-sample>small{font:12px sans-serif;color:#6d7e86;letter-spacing:2px}.rim-sample .single-card{width:280px}.rim-sample .card-reverse{inset:0}@media(max-width:800px){.rim-preview{gap:38px;flex-wrap:wrap}}</style></head>
<body><div id="preview"></div><script type="module">
import '/src/assets/main.css'
import '/src/assets/spectrum.css'
import '/src/assets/imagery.css'
import '/src/assets/product.css'
import {createApp,h} from 'vue'
import SongCard from '/src/components/SongCard.vue'
import CardAura from '/src/components/CardAura.vue'
import {catalog,loadCatalog,cardFor} from '/src/game/save.ts'
await loadCatalog()
const silver={...cardFor(catalog.songs.find(s=>s.title==='遇见')),count:1,isNew:true,rarity:'normal'}
const gold={...cardFor(catalog.songs.find(s=>s.title==='冻结')),count:1,isNew:true,rarity:'gold'}
createApp({render:()=>new URLSearchParams(location.search).has('summary') ? h('main',{class:'pack-overlay'},[h('div',{class:'revealed-grid'},[silver,silver,gold,silver,gold].map(card=>h('div',{class:'reveal-card face'},[h(CardAura,{rarity:card.rarity}),h(SongCard,{card})])))]) : h('main',{class:'rim-preview'},[
  h('section',{class:'rim-sample'},[h('div',{class:'single-card'},[h(CardAura),h('span',{class:'card-side card-reverse card-back-design'},[h('small','SONGSPACE'),h('strong','♪'),h('span','音乐收藏卡')])])]),
  ...[[silver,'普通卡 · 银色金属'],[gold,'金卡 · 香槟金属']].map(([card,label])=>h('section',{class:'rim-sample'},[h('div',{class:'single-card'},[h(CardAura,{rarity:card.rarity}),h(SongCard,{card})])]))
])}).mount('#preview')
</script></body></html>
