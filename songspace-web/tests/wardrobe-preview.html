<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>歌境 · 3D 装扮验证</title><style>body{margin:0;background:#f5f7f8;color:#29364d;font-family:'Microsoft YaHei',sans-serif}main{max-width:880px;margin:48px auto;padding:24px}h1{font-size:24px}section{display:grid;grid-template-columns:360px 1fr;gap:24px}aside,article{border:1px solid #d5dfeb;border-radius:12px;padding:22px;background:#f0f5f8}article{background:white;height:fit-content}h2{font-size:18px}p{font-size:12px;line-height:1.8;color:#61728b}button{font:inherit;cursor:pointer;padding:10px 18px;background:#e4efea;border:1px solid #bed3c8;border-radius:8px;color:#324f43}@media(max-width:650px){section{grid-template-columns:1fr}main{margin:10px auto}}</style></head><body><div id="app"></div><script type="module">
import {createApp,ref,h} from 'vue'
import CharacterPreview from '/src/components/CharacterPreview.vue'
import {OUTFITS} from '/src/game/outfits.ts'
createApp({setup(){const worn=ref(false);return()=>h('main',[
 h('h1','人物装扮 · 3D 验证'),h('p','独立预览，不修改玩家存档。'),h('section',[
 h('aside',[h('h2','我的人物'),h(CharacterPreview,{outfits:worn.value?OUTFITS:[]}),h('p',worn.value?'正在穿戴：旅途背包':'当前未穿戴')]),
 h('article',[h('h2','旅途背包'),h('p','与探索共用同一个 3D 模型。穿戴、卸下与简单动作均可在这里检查。'),h('button',{onClick:()=>worn.value=!worn.value},worn.value?'卸下背包':'穿戴背包')])])])}}).mount('#app')
</script></body></html>
