<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>歌境 · 装扮预览</title></head><body style="background:#f7f9f6"><div class="play-app"><section class="warehouse-page wardrobe-page"><div id="app"></div></section></div><script type="module">
import '/src/assets/main.css'
import '/src/assets/spectrum.css'
import '/src/assets/imagery.css'
import '/src/assets/product.css'
import {createApp,h} from 'vue'
import CharacterWardrobe from '/src/components/CharacterWardrobe.vue'
import {catalog, game} from '/src/game/save.ts'
const response=await fetch('/catalog/qqmusic-hot-100.json');catalog.songs=(await response.json()).songs
for(const title of ['你的背包','红色高跟鞋','青花']){const song=catalog.songs.find(s=>s.title===title);game.owned[song.id]=1}
game.equippedOutfits={back:'travel-backpack',feet:'red-high-heels',accessory:'qinghua-token'}
createApp({render:()=>h(CharacterWardrobe)}).mount('#app')
</script></body></html>
