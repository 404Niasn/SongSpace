<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>歌境 · 天气场景校验</title><style>body{margin:0;padding:24px;background:#f6f8fa;color:#33434d;font:14px system-ui}header{display:flex;align-items:center;gap:12px;margin-bottom:20px}h1{font-size:22px;margin-right:auto}button,select{padding:10px 18px;border:1px solid #d1dde1;border-radius:8px;background:white;color:inherit}button.active{background:#dfede6}.views{display:grid;grid-template-columns:1fr 1fr;gap:20px}.view{height:460px;border-radius:12px;overflow:hidden;background:#e7ecee}.world-canvas,.race-canvas{height:100%}h2{font-size:15px;font-weight:500}@media(max-width:800px){.views{grid-template-columns:1fr}.view{height:400px}}</style></head><body><header><h1>歌曲天气 · 场景校验</h1><select aria-label="歌曲地图" id="world"><option value="sea">《大海》</option><option value="forest">《挪威的森林》</option><option value="jiangnan">《江南》</option></select><button data-weather="clear">默认天气</button><button data-weather="sunset">《黄昏》· 黄昏</button><button data-weather="rain" class="active">《雨爱》· 雨天</button></header><div class="views"><section><h2>世界布置</h2><div class="view" id="mini"></div></section><section><h2>第三人称闯关 · 暂停预览</h2><div class="view" id="race"></div></section></div><script type="module">
import { WorldEngine } from '/src/worlds/engine.ts'
import { Race } from '/src/game/race.ts'
let world='sea',weather='rain',race
const miniature=new WorldEngine(document.querySelector('#mini'),world,()=>{},()=>{},console.error)
function render(){miniature.setWorld(world);miniature.setWeather(weather);race?.dispose();race=new Race(document.querySelector('#race'),world,()=>{},()=>{},'#58c6b4',13,false,[],[],undefined,weather);race.start();race.togglePause()}
render()
document.querySelector('#world').addEventListener('change',e=>{world=e.target.value;render()})
for(const button of document.querySelectorAll('[data-weather]'))button.addEventListener('click',()=>{weather=button.dataset.weather;for(const other of document.querySelectorAll('[data-weather]'))other.classList.toggle('active',other===button);render()})
addEventListener('beforeunload',()=>{miniature.dispose();race.dispose()})
</script></body></html>
